<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">b1swa25 — security and threat intelligence</title>
  <desc id="description">An animated dark cyber dashboard header with a scanning signal and a map-style network.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081320"/>
      <stop offset="0.58" stop-color="#101c2c"/>
      <stop offset="1" stop-color="#101126"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3c5"/>
      <stop offset="1" stop-color="#7c6cff"/>
