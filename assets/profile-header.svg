  <rect x="58" y="198" width="72" height="4" rx="2" fill="url(#accent)"/>
  <text x="56" y="240" fill="#c6d1df" font-family="Segoe UI,Arial,sans-serif" font-size="23">Cybersecurity  /  Threat Intelligence  /  Systems</text>
  <text x="58" y="296" fill="#8294ab" font-family="Consolas,monospace" font-size="15">&gt; learning by building, one signal at a time</text>
